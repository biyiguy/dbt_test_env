version: 2

models:
  - name: dim_customers
    description: Dimension table containing one record per customer
    columns:
      - name: customer_id
        description: Unique identifier for a customer
        # tests:
        #   - not_null
        #   - unique

      - name: first_name
        description: Customer first name

      - name: last_name
        description: Customer last name

      - name: email
        description: Customer email address

      - name: customer_created_at
        description: Timestamp when the customer account was created


  - name: fct_customer_revenue
    description: Fact table containing revenue metrics per customer
    columns:
      - name: customer_id
        description: Unique identifier for a customer
        # tests:
        #   - not_null

      - name: first_name
        description: Customer first name (denormalized for ease of use)

      - name: last_name
        description: Customer last name (denormalized for ease of use)

      - name: total_orders
        description: Total number of completed orders for the customer

      - name: total_revenue
        description: Total revenue generated by the customer
